<div
  class="bg-dark min-vh-100 d-flex justify-content-center align-items-center">

  <div
    class="card border-0 shadow-lg p-5"
    style="width: 400px; border-radius: 20px;">

    <h2 class="text-center fw-bold mb-4 text-primary">

      Welcome Back 

    </h2>




    <form (ngSubmit)="login()">

      <div class="mb-3">

        <label class="form-label fw-semibold">

          Email

        </label>

        <input
          type="email"
          class="form-control form-control-lg"
          [(ngModel)]="loginData.email"
          name="email"
          required>

      </div>




      <div class="mb-4">

        <label class="form-label fw-semibold">

          Password

        </label>

        <input
          type="password"
          class="form-control form-control-lg"
          [(ngModel)]="loginData.password"
          name="password"
          required>

      </div>

      <button
        class="btn btn-primary w-100 btn-lg">

        Login

      </button>

    </form>




    <p class="text-center mt-4">

      Don’t have an account?

      <a
        routerLink="/register"
        class="text-decoration-none fw-semibold">

        Register

      </a>

    </p>

  </div>

</div>

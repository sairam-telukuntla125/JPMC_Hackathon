<div
  class="bg-dark min-vh-100 d-flex justify-content-center align-items-center">

  <div
    class="card border-0 shadow-lg p-5"
    style="width: 450px; border-radius: 20px;">

    <h2 class="text-center fw-bold mb-4 text-primary">

      Create Account 

    </h2>




    <form (ngSubmit)="register()">

      <div class="mb-3">

        <label class="form-label fw-semibold">

          Name

        </label>

        <input
          type="text"
          class="form-control form-control-lg"
          [(ngModel)]="registerData.name"
          name="name"
          required>

      </div>




      <div class="mb-3">

        <label class="form-label fw-semibold">

          Email

        </label>

        <input
          type="email"
          class="form-control form-control-lg"
          [(ngModel)]="registerData.email"
          name="email"
          required>

      </div>




      <div class="mb-3">

        <label class="form-label fw-semibold">

          Password

        </label>

        <input
          type="password"
          class="form-control form-control-lg"
          [(ngModel)]="registerData.password"
          name="password"
          required>

      </div>




      <div class="mb-4">

        <label class="form-label fw-semibold">

          Role

        </label>

        <select
          class="form-select form-select-lg"
          [(ngModel)]="registerData.role"
          name="role">

          <option value="student">
            Student
          </option>

          <option value="volunteer">
            Volunteer
          </option>

        </select>

      </div>




      <button
        class="btn btn-primary w-100 btn-lg">

        Register

      </button>

    </form>




    <p class="text-center mt-4">

      Already have an account?

      <a
        routerLink="/login"
        class="text-decoration-none fw-semibold">

        Login

      </a>

    </p>

  </div>

</div>
